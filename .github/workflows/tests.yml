name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,plot]"
      - run: python -m ruff check hydrostar_mcp scripts tests
      - run: python -m pytest -q -m "not integration" --basetemp .pytest-tmp
      - run: python scripts/check_release.py
      - run: python -m build
