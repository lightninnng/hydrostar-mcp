[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrostar-mcp"
version = "0.5.0"
description = "Validated HydroStar input generation and local MCP automation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "lightninnng"}]
keywords = ["hydrostar", "mcp", "hydrodynamics", "seakeeping", "offshore"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plot = ["matplotlib>=3.8,<4", "numpy>=1.24,<3", "Pillow>=10,<13"]
geometry = ["gmsh>=4.15,<5", "ezdxf>=1.4,<2", "meshio>=5.3,<6", "shapely>=2,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "Pillow>=10,<13", "pypdfium2>=4.30,<6"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/lightninnng/hydrostar-mcp"
Documentation = "https://github.com/lightninnng/hydrostar-mcp/tree/main/docs"
Issues = "https://github.com/lightninnng/hydrostar-mcp/issues"

[project.scripts]
hydrostar-mcp = "hydrostar_mcp.server:main"
hydrostar-case = "hydrostar_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["hydrostar_mcp*"]

[tool.setuptools.package-data]
hydrostar_mcp = ["drawing_workbench.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the installed HydroStar executables"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep the validated correctness rules stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
